<div class="map">
  @if (mapReady) {
    <!-- Aircraft markers are custom rotatable OverlayViews managed in the
         component (see syncAircraftMarkers), not declarative <map-marker>s. -->
    <google-map
      class="map__canvas"
      width="100%"
      height="100%"
      [center]="center"
      [zoom]="zoom"
      [options]="mapOptions"
      (mapInitialized)="onMapInitialized($event)"
    />

    <!-- Floating details panel for the selected aircraft -->
    @if (selectedFlightInfo(); as info) {
      <app-aircraft-info-panel
        class="map__panel"
        [info]="info"
        [activeActions]="activeActions()"
        (close)="clearSelection()"
        (action)="onPanelAction($event)"
      />
    }
  } @else if (loadError) {
    <div class="map__status map__status--error" role="alert">
      <p>Map failed to load.</p>
      <p class="map__status-detail">{{ loadError }}</p>
    </div>
  } @else {
    <div class="map__status" role="status">
      <p>Loading map…</p>
    </div>
  }
</div>
