<nav
  class="app-header"
  [class.app-header--night]="theme() === 'night'"
  role="navigation"
  aria-label="Primary"
>
  <span class="app-header__brand">
    <!-- SVG plane (inherits currentColor) so the logo colour is themeable -->
     <span class="app-header__icon" aria-hidden="true">✈️</span>
    <!-- <svg
      class="app-header__icon"
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="currentColor"
      aria-hidden="true"
    >
      <path
        d="M22 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L14 19v-5.5l8 2.5z"
      />
    </svg> -->
    <span class="app-header__title">{{ title }}</span>
  </span>

  <button
    type="button"
    class="app-header__theme-toggle"
    (click)="toggleTheme()"
    [attr.aria-label]="
      theme() === 'day' ? 'Switch map to night mode' : 'Switch map to day mode'
    "
    [attr.aria-pressed]="theme() === 'night'"
    [title]="theme() === 'day' ? 'Night mode' : 'Day mode'"
  >
    @if (theme() === 'day') {
      <!-- Moon: click to switch to night mode -->
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    } @else {
      <!-- Sun: click to switch back to day mode -->
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="5" />
        <line x1="12" y1="1" x2="12" y2="3" />
        <line x1="12" y1="21" x2="12" y2="23" />
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
        <line x1="1" y1="12" x2="3" y2="12" />
        <line x1="21" y1="12" x2="23" y2="12" />
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
      </svg>
    }
  </button>
</nav>
